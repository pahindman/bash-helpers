name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0

      - name: Run tests
        run: bats test --print-output-on-failure
