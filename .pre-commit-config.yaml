ci:
  submodules: true
repos:
# General file hygiene
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-yaml
  - id: check-json
# Validate repository-wide whitespace and indentation against .editorconfig
- repo: https://github.com/editorconfig-checker/editorconfig-checker.python
  rev: 3.11.1
  hooks:
  - id: editorconfig-checker
    alias: ec
# Format shell scripts according to .editorconfig rules
- repo: https://github.com/scop/pre-commit-shfmt
  rev: v3.14.1-1
  hooks:
  - id: shfmt
# Static analysis for Bash / shell script bugs and style warnings
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    exclude: '^LICENSE$'
- repo: local
  hooks:
  - id: getopt-bats-tests
    name: getopt Tests
    entry: test/bats-precommit-wrapper
    language: node
    additional_dependencies:
    - bats@1.11.0
    files: getopt
  - id: progress_bar-bats-tests
    name: progress_bar Tests
    entry: test/bats-precommit-wrapper
    language: node
    additional_dependencies:
    - bats@1.11.0
    files: progress_bar
  - id: spinner-bats-tests
    name: spinner Tests
    entry: test/bats-precommit-wrapper
    language: node
    additional_dependencies:
    - bats@1.11.0
    files: spinner
  - id: trap-bats-tests
    name: trap Tests
    entry: test/bats-precommit-wrapper
    language: node
    additional_dependencies:
    - bats@1.11.0
    files: trap
